[package]
name = "jarvis"
version = "0.1.0"
description = "Local-first personal knowledge interface for macOS"
authors = ["Setayesh (Sissighn)"]
license = "MIT"
repository = "https://github.com/Sissighn/jarvis-knowledge-interface"
edition = "2024"
rust-version = "1.89.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "jarvis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
cpal = "0.16"
hound = "3.5"
log = "0.4"
tauri = { version = "2.11.3", features = ["image-png", "tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-shell = "2.3.5"
