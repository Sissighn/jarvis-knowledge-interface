<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>JARVIS</title>
    <style>
      :root {
        color: #f8edf3;
        background: #090508;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at center, rgb(247 184 216 / 10%), transparent 34%),
          #090508;
      }

      main {
        display: grid;
        justify-items: center;
        gap: 22px;
      }

      .core {
        position: relative;
        width: 92px;
        height: 92px;
        border: 1px solid rgb(247 184 216 / 34%);
        border-radius: 50%;
        box-shadow:
          0 0 30px rgb(247 184 216 / 14%),
          inset 0 0 24px rgb(247 184 216 / 8%);
        animation: breathe 1.8s ease-in-out infinite;
      }

      .core::before,
      .core::after {
        position: absolute;
        inset: 15px;
        border: 1px solid rgb(255 225 240 / 42%);
        border-radius: 50%;
        content: "";
      }

      .core::after {
        inset: 34px;
        background: #ffe4f1;
        border: 0;
        box-shadow: 0 0 22px #f7b8d8;
      }

      p {
        margin: 0;
        color: rgb(248 237 243 / 72%);
        font-size: 12px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
      }

      small {
        max-width: 420px;
        color: rgb(248 237 243 / 46%);
        font-size: 13px;
        line-height: 1.6;
        text-align: center;
      }

      @keyframes breathe {
        0%,
        100% {
          opacity: 0.72;
          transform: scale(0.96);
        }

        50% {
          opacity: 1;
          transform: scale(1.04);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .core {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="core" aria-hidden="true"></div>
      <p>JARVIS wird gestartet</p>
      <small id="status" role="status">Der lokale Wissensserver wird vorbereitet.</small>
    </main>
    <script>
      window.setTimeout(() => {
        const status = document.querySelector("#status");
        if (status) {
          status.textContent =
            "Der Start dauert länger als erwartet. Bitte JARVIS über das Menüleisten-Icon beenden und erneut öffnen.";
        }
      }, 30000);
    </script>
  </body>
</html>
